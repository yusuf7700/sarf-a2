<!-- PWA: service worker + o'rnatish tugmasi mantiqi -->
<script>
(function () {
  // 1) Service worker ro'yxatdan o'tkazish
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js').catch(function (err) {
        console.warn('Service worker ro\'yxatdan o\'tmadi:', err);
      });
    });
  }

  var deferredPrompt = null;
  var installBlock = document.getElementById('pwaInstallBlock');
  var installBtn = document.getElementById('pwaInstallBtn');
  var installHint = document.getElementById('pwaInstallHint');

  function isStandalone() {
    return window.matchMedia('(display-mode: standalone)').matches ||
      window.navigator.standalone === true;
  }

  function isIOS() {
    return /iphone|ipad|ipod/i.test(window.navigator.userAgent);
  }

  function showInstallBlock() {
    if (isStandalone()) return; // allaqachon o'rnatilgan bo'lsa, ko'rsatmaymiz
    installBlock.style.display = 'block';
  }

  // Android/Desktop Chrome: brauzer o'zi taklif signalini beradi
  window.addEventListener('beforeinstallprompt', function (e) {
    e.preventDefault();
    deferredPrompt = e;
    showInstallBlock();
  });

  // iOS Safari beforeinstallprompt'ni qo'llamaydi — qo'lda ko'rsatma beramiz
  if (isIOS() && !isStandalone()) {
    showInstallBlock();
    installHint.style.display = 'block';
    installHint.textContent = "iPhone/iPad'da: pastdagi \"Ulashish\" tugmasini bosing, so'ng \"Bosh ekranga qo'shish\"ni tanlang.";
  }

  installBtn.addEventListener('click', function () {
    if (deferredPrompt) {
      deferredPrompt.prompt();
      deferredPrompt.userChoice.finally(function () {
        deferredPrompt = null;
        installBlock.style.display = 'none';
      });
    } else if (isIOS()) {
      installHint.style.display = 'block';
      installHint.textContent = "iPhone/iPad'da: pastdagi \"Ulashish\" tugmasini bosing, so'ng \"Bosh ekranga qo'shish\"ni tanlang.";
    } else {
      installHint.style.display = 'block';
      installHint.textContent = "Brauzeringiz avtomatik o'rnatishni qo'llamaydi. Brauzer menyusidan \"Bosh ekranga qo'shish\" / \"Ilova sifatida o'rnatish\"ni qidiring.";
    }
  });

  window.addEventListener('appinstalled', function () {
    installBlock.style.display = 'none';
    deferredPrompt = null;
  });

  // Sozlamalar → "Keshni tozalash" tugmasi shu funksiyani chaqiradi
  window.clearAppCache = function () {
    var btn = document.getElementById('clearCacheBtn');
    if (btn) { btn.textContent = "⏳ Tozalanmoqda..."; btn.style.pointerEvents = 'none'; }

    var cachesDone = ('caches' in window)
      ? caches.keys().then(function (names) {
          return Promise.all(names.map(function (n) { return caches.delete(n); }));
        })
      : Promise.resolve();

    var swDone = ('serviceWorker' in navigator)
      ? navigator.serviceWorker.getRegistrations().then(function (regs) {
          return Promise.all(regs.map(function (r) { return r.unregister(); }));
        })
      : Promise.resolve();

    Promise.all([cachesDone, swDone]).finally(function () {
      // Force-reload, bypassing any residual cache
      window.location.reload();
    });
  };
})();
</script>
